# VYTRIX Pipeline Configuration (Round 1)
scene:
  id: "home-01"
  title: "VYTRIX Reconstructed Space"
  units: "metres"
  up_axis: "+Y"
  handedness: "right"
  eye_height_m: 1.6

capture:
  device: "Smartphone (Wide Camera, 4K/1080p 30fps)"
  fps: 30
  scale_reference_type: "measured_distance" # tape on floor or door height
  scale_reference_meters: 1.00 # Real-world measured distance in metres

preprocess:
  target_frames: 350
  blur_threshold_variance: 100.0 # Frames below this Laplacian variance are discarded
  downscale_factor: 1 # 1 = original resolution, 2 = half-res for faster SfM
  min_frame_interval: 2

sfm:
  matcher: "auto" # "auto": exhaustive when frames <= 300, sequential when > 300
  matcher_auto_threshold: 300
  overlap_window: 20
  loop_detection: true
  camera_model: "SIMPLE_RADIAL" # Robust for smartphone video with unknown focal lengths
  min_registered_ratio: 0.70 # Abort if <70% frames register
  use_gpu: true # Set false if COLMAP build lacks CUDA support

training:
  iterations: 15000 # Default for Colab T4
  sh_degree: 3
  colab_drive_checkpoint_dir: "/content/drive/MyDrive/VYTRIX_Checkpoints"

normalization:
  floor_ransac:
    distance_threshold: 0.03 # 3 cm RANSAC plane tolerance
    max_iterations: 2000

compression:
  prune_opacity_threshold: 0.05
  export_format: "splat" # Standard 32-byte Gaussian splat format

viewer:
  walk_speed_m_per_s: 1.4
  run_multiplier: 2.2
  mouse_sensitivity: 0.002
  fov_degrees: 75
  fly_mode_toggle_key: "f"
  fps_hud_default: true
